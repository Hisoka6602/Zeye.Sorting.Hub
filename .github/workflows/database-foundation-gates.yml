# 中文说明：执行数据库底座、编译守卫与文本编码门禁。
name: database-foundation-gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "Directory.Build.targets"
      - ".gitattributes"
      - "deploy/**"
      - "README.md"
      - "数据库底座门禁说明.md"
      - "检查台账/**"
      - "更新记录.md"
      - "Zeye.Sorting.Hub.Application/**"
      - "Zeye.Sorting.Hub.Contracts/**"
      - "Zeye.Sorting.Hub.Domain/**"
      - "Zeye.Sorting.Hub.Host/**"
      - "Zeye.Sorting.Hub.Host.Tests/**"
      - "Zeye.Sorting.Hub.Infrastructure/**"
      - "Zeye.Sorting.Hub.SharedKernel/**"
      - "Zeye.Sorting.Hub.Web/**"

permissions:
  contents: read

jobs:
  build-and-test:
    name: 数据库底座构建与测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate garbled Chinese text
        shell: bash
        run: bash ./.github/scripts/validate-garbled-chinese-text.sh

      - name: Restore
        run: dotnet restore Zeye.Sorting.Hub.sln

      - name: Build
        run: dotnet build Zeye.Sorting.Hub.sln --no-restore -c Release

      - name: Test
        run: dotnet test Zeye.Sorting.Hub.sln --no-build -c Release --logger "console;verbosity=normal"

      - name: Setup Node.js for bundled publish
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Zeye.Sorting.Hub.Web/package-lock.json

      - name: Publish bundled frontend and backend
        shell: pwsh
        run: |
          $publishPath = Join-Path $env:RUNNER_TEMP 'hub-single-host'
          $arguments = @('publish', 'Zeye.Sorting.Hub.Host/Zeye.Sorting.Hub.Host.csproj', '-c', 'Release', '-o', $publishPath)
          if ($IsWindows) { $arguments += '-p:PublishProfile=Windows-x64' }
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $publishPath 'wwwroot/index.html'))) { throw 'Bundled frontend is missing.' }
          if (-not (Test-Path (Join-Path $publishPath 'Zeye.Sorting.Hub.Host.dll'))) { throw 'Backend is missing.' }

  frontend-build-and-test:
    name: 前端构建与测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: Zeye.Sorting.Hub.Web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Zeye.Sorting.Hub.Web/package-lock.json

      - name: Install
        run: npm ci --include=optional --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  foundation-rules:
    name: 数据库底座规则门禁
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 禁止 UTC / 时区后缀
        run: ./.github/scripts/validate-no-utc.sh

      - name: README 文件树对账
        run: ./.github/scripts/validate-readme-file-tree.sh

      - name: 敏感配置拦截
        run: ./.github/scripts/validate-sensitive-config.sh

      - name: 影分身代码拦截
        run: ./.github/scripts/validate-no-shadow-code.sh

      - name: 枚举 / HostedService / 后台循环 / 有界容量校验
        run: ./.github/scripts/validate-database-foundation-rules.sh --check advanced
